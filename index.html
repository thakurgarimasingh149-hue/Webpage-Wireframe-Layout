<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Layout Homework</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2b0b2b; /* Dark purple background matching the image frame */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            display: grid;
            /* 4 equal columns */
            grid-template-columns: repeat(4, 1fr);
            /* 4 explicit rows with specific heights matching the layout grid lines */
            grid-template-rows: 60px 80px 80px 60px;
            gap: 8px;
            width: 650px;
            background: #ffffff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        /* Positioning items according to the grid lines in your image */
        .header {
            grid-column: 1 / 5;
            grid-row: 1 / 2;
            background-color: #cce0ff;
        }

        .sidebar {
            grid-column: 1 / 2;
            grid-row: 2 / 4;
            background-color: #d4edda;
        }

        .title {
            grid-column: 2 / 5;
            grid-row: 2 / 3;
            background-color: #fce4ec;
        }

        .article1 {
            grid-column: 2 / 3;
            grid-row: 3 / 4;
            background-color: #f8bbd0;
        }

        .article2 {
            grid-column: 3 / 4;
            grid-row: 3 / 4;
            background-color: #e1bee7;
        }

        .article3 {
            grid-column: 4 / 5;
            grid-row: 3 / 4;
            background-color: #d1c4e9;
        }

        .footer {
            grid-column: 1 / 5;
            grid-row: 4 / 5;
            background-color: #cce0ff;
        }

        /* Common styling for all grid boxes */
        .container > div {
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #333;
            border-radius: 4px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">header</div>
        <div class="sidebar">sidebar</div>
        <div class="title">title</div>
        <div class="article1">article1</div>
        <div class="article2">article2</div>
        <div class="article3">article3</div>
        <div class="footer">footer</div>
    </div>

</body>
</html>
